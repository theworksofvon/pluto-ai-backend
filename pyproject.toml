[project]
name = "pluto-ai"
version = "0.1.0"
description = "NBA Prediction Agent"
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pipreqs (>=0.5.0,<0.6.0)",
    "aiohttp (>=3.11.13,<4.0.0)",
    "fastapi (>=0.115.11,<0.116.0)",
    "pandas (>=2.2.3,<3.0.0)",
    "pydantic (>=2.10.6,<3.0.0)",
    "pydantic-settings (>=2.8.1,<3.0.0)",
    "uvicorn (>=0.34.0,<0.35.0)",
    "llama-index-embeddings-huggingface (>=0.5.2,<0.6.0)",
    "llama-index-llms-ollama (>=0.5.2,<0.6.0)",
    "black (>=25.1.0,<26.0.0)",
    "joblib (>=1.4.2,<2.0.0)",
    "numpy (>=1.22.2,<3.0.0)",
    "scikit-learn (>=1.6.1,<2.0.0)",
    "nba-api (>=1.7,<2.0)",
    "datasets (>=3.3.2,<4.0.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "openai (>=1.68.2,<2.0.0)",
    "llama-index (>=0.12.25,<0.13.0)",
    "llama-parse (>=0.6.4.post1,<0.7.0)",
    "requests (>=2.32.3,<3.0.0)",
    "requests-oauthlib (>=2.0.0,<3.0.0)",
    "python-jose (>=3.4.0,<4.0.0)",
    "supabase (>=2.15.0,<3.0.0)",
    "apscheduler (>=3.11.0,<4.0.0)",
    "resend (>=2.7.0,<3.0.0)",
    "sqlalchemy[asyncio] (==2.0.40)",
    "aiosqlite (>=0.21.0,<0.23.0)",
    "alembic (>=1.16.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "typer (>=0.16.0,<1.0.0)",
]

[project.scripts]
pluto = "app.cli:main"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry]
package-mode = false
[tool.poetry.dependencies]
[tool.poetry.group.dev.dependencies]
pytest = "==8.3.5"
pytest-asyncio = ">=0.25.0,<2.0.0"
ruff = ">=0.9.0,<1.0.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
include = ["app/**/*.py", "tests/**/*.py"]
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
